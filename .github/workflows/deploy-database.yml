# Applies database changes and loads the church list into Supabase after each change on main.
# Does nothing until the Supabase secrets are added (see docs/setup-guide.md).
name: Deploy database
on:
  push:
    branches: [main]
    paths: ["data/**", "supabase/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-database
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip until Supabase is set up
        id: ready
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Supabase secrets not set yet; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v5
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build seed.sql from data/*.csv
        if: steps.ready.outputs.go == 'true'
        run: node app/scripts/make-seed-sql.mjs
      - if: steps.ready.outputs.go == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply schema changes
        if: steps.ready.outputs.go == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
      - name: Load places and service times
        if: steps.ready.outputs.go == 'true'
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Deploy the corrections box (only once the access token is added)
        if: steps.ready.outputs.go == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          supabase functions deploy submit-correction --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          if [ -n "${{ secrets.TURNSTILE_SECRET }}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" TURNSTILE_SECRET="${{ secrets.TURNSTILE_SECRET }}" ALLOWED_ORIGIN="${{ vars.SITE_ORIGIN || 'https://coptic.myorthodoxchurch.com,https://coptic-church-app.moureenjgoubran.workers.dev' }}"
          fi
          if [ -n "${{ secrets.RESEND_API_KEY }}" ] && [ -n "${{ secrets.NOTIFY_EMAIL }}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" NOTIFY_EMAIL="${{ secrets.NOTIFY_EMAIL }}"
          fi
