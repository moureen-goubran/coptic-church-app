# Weekly leak check (private data stays locked, Supabase's security advisor, known holes in packages) and safety check of every outside link (spam takeovers, dead links, redirects) and the live site's
# security headers, plus a malware check when the free SAFE_BROWSING_KEY secret is set. Fails (and GitHub emails
# the owner) if a link turned into spam or malware, or a security header is gone.
name: Link safety check
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
  push:
    paths: [".github/workflows/link-check.yml", "app/scripts/check-links.mjs", "app/scripts/check-security.mjs"]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Leak check
        run: node app/scripts/check-security.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Link check
        if: always()
        run: node app/scripts/check-links.mjs
        env:
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
