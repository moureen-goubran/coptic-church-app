name: tmp verify
on:
  push:
    branches: [claude/project-thread-xuqasw]
    paths: [".github/workflows/tmp-verify.yml"]
permissions:
  contents: read
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "TURNSTILE_SECRET set: ${{ secrets.TURNSTILE_SECRET != '' }}"
          echo "SUPABASE_ACCESS_TOKEN set: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}"
          echo "SITE_ORIGIN var: '${{ vars.SITE_ORIGIN }}'"
          B=https://coptic-church-app.moureenjgoubran.workers.dev
          curl -s $B/ -o i.html; JS=$(grep -o '/assets/index-[^"]*\.js' i.html | head -1); echo "bundle $JS"
          curl -s $B$JS -o a.js
          echo "turnstile site key in bundle: $(grep -c '0x4AAAA' a.js)"; grep -o '0x4AAAA[A-Za-z0-9_-]*' a.js | head -1 | cut -c1-12
          echo "supabase url in bundle: $(grep -o 'https://[a-z0-9]*\.supabase\.co' a.js | head -1)"
          S=$(grep -o 'https://[a-z0-9]*\.supabase\.co' a.js | head -1)
          [ -n "$S" ] && curl -s -i -X OPTIONS -H "Origin: $B" $S/functions/v1/submit-correction | grep -i -E "^HTTP|access-control-allow-origin"
          curl -sI https://coptic.myorthodoxchurch.com | head -3 || true
