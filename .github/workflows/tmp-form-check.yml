name: tmp form check
on:
  push:
    branches: [claude/project-thread-xuqasw]
    paths: [".github/workflows/tmp-form-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          echo "secret length: ${#SECRET}, starts 0x: $([[ $SECRET == 0x* ]] && echo yes || echo no)"
          echo "siteverify with a fake token (secret is fine if it says invalid-input-response only):"
          curl -s https://challenges.cloudflare.com/turnstile/v0/siteverify -d "secret=$SECRET" -d "response=fake"; echo
          F=https://mzlezpmklamwvtdgcqju.supabase.co/functions/v1/submit-correction
          for O in https://coptic.myorthodoxchurch.com https://coptic-church-app.moureenjgoubran.workers.dev; do
            echo "== $O"
            curl -s -D - -o /dev/null -X OPTIONS -H "Origin: $O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,apikey" $F | grep -i "^HTTP\|access-control-allow-origin\|access-control-allow-headers"
            curl -s -w " [%{http_code}]\n" -X POST -H "Origin: $O" -H "content-type: application/json" -H "apikey: sb_publishable_lBDzeScxPJ6L7SvqhrFRBQ_3MmUsLJi" -d '{"message":"test","token":"fake","topic":"other"}' $F
          done
